# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# last window
bind-key C-a last-window

# pane splitting
unbind % # Remove default binding since we’re replacing
bind | split-window -h
bind - split-window -v

# Status bar (minimalist)
set -g status-interval 5
set -g status-style "bg=black,fg=white"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[fg=green,bold] #h #[default]"
# Yellow dot appears only while the prefix key is armed
set -g status-right "#[fg=yellow,bold]#{?client_prefix,● ,}#[fg=green]%Y-%m-%d %H:%M "

# Window list: active window = red bg, activity = yellow bg, bold white text
set -g monitor-activity on
set -g visual-activity off
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=white,bg=black"
set -g window-status-current-style "fg=white,bg=red,bold"
set -g window-status-activity-style "fg=black,bg=yellow,bold"

set -g default-terminal "tmux-256color"

# Tell tmux explicitly that Alacritty supports Truecolor and undercurls
set -as terminal-features "alacritty*:RGB"
set -as terminal-features "alacritty*:usstyle"

# Bulletproof fallback for Neovim (forces the classic 'Tc' truecolor flag)
set -ga terminal-overrides ",alacritty*:Tc"

# set -as terminal-features ",*:RGB"
# set -as terminal-features ",*:usstyle"
set -g default-shell /opt/homebrew/bin/bash
set -g default-command "/opt/homebrew/bin/bash -l"

# Mouse support
set -g mouse off

# Copy mode
set-window-option -g mode-keys vi
bind k copy-mode
bind Escape copy-mode
unbind p
bind p paste-buffer

# vi-style copy bindings with macOS clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste from macOS clipboard
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
